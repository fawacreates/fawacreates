name: Update streak stats

on:
  schedule:
    - cron: "0 3 * * *"          # every day at 03:00 UTC
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  workflow_dispatch:             # you can also run it manually

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=fawacreates&theme=dark&hide_border=true&background=0D0D0D&ring=F2789F&fire=D8567F&currStreakNum=F2789F&sideNums=D8567F&currStreakLabel=F2789F&sideLabels=9A6B82&dates=C398AF
          path: assets/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit the SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p assets
          git add assets/streak.svg
          git commit -m "chore: update contribution streak" || exit 0
          git push
